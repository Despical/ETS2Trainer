name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Publish portable application
        run: ./build.ps1 -OutputDirectory ./artifacts/publish

      - name: Build Windows setup
        run: ./installer/build.ps1 -PublishDirectory ./artifacts/publish -OutputDirectory ./artifacts

      - name: Package release files
        run: |
          $version = ([xml](Get-Content ./src/ETS2Trainer/ETS2Trainer.csproj)).Project.PropertyGroup.Version
          $package = New-Item -ItemType Directory -Path ./artifacts/package -Force
          foreach ($file in @('ETS2Trainer.exe', 'README.md', 'LICENSE', 'Start Trainer.cmd')) {
              Copy-Item -LiteralPath (Join-Path ./artifacts/publish $file) -Destination $package.FullName
          }
          Copy-Item -LiteralPath ./artifacts/publish/licenses -Destination $package.FullName -Recurse
          $name = "ETS2Trainer-$version-win-x64.zip"
          $archive = Join-Path (Resolve-Path ./artifacts).Path $name
          Compress-Archive -LiteralPath (Get-ChildItem -LiteralPath $package.FullName).FullName -DestinationPath $archive -CompressionLevel Optimal
          $checksums = foreach ($file in @($name, "ETS2Trainer-$version-Setup-x64.exe")) {
              $hash = (Get-FileHash -LiteralPath (Join-Path ./artifacts $file) -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $file"
          }
          $checksums | Set-Content ./artifacts/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Upload Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ETS2Trainer-win-x64
          path: |
            artifacts/ETS2Trainer-*-win-x64.zip
            artifacts/ETS2Trainer-*-Setup-x64.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
