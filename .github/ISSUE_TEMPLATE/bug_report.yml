name: Bug report
description: Report a problem with ETS2Trainer.
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: trainer-version
    attributes:
      label: ETS2Trainer version
      placeholder: '0.5.1'
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: ETS2 version and platform
      placeholder: '1.61.1.9, Steam x64'
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version and display mode
      placeholder: 'Windows 11, borderless, 1920×1080, 100% scaling'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Explain what you did, what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Include relevant error text, screenshots and whether mods are active. Remove personal information from attachments.
